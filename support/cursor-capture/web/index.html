<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Cursor Protocol Debugger</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>Cursor Protocol Debugger</strong>
        </div>
        <div class="runtime-status" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Connecting</span>
          <code id="service-address"></code>
        </div>
        <div class="toolbar-actions">
          <button id="pause-button" class="icon-button" type="button" title="Pause UI updates" aria-label="Pause UI updates">Ⅱ</button>
          <button id="clear-button" class="button danger" type="button">Clear</button>
        </div>
      </header>

      <section class="filterbar" aria-label="Request filters">
        <div class="search-box url-filter">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="Filter by URL, message type, or status" autocomplete="off" />
        </div>
        <div class="search-box request-id-filter">
          <span aria-hidden="true">⌕</span>
          <input id="request-id-input" type="search" placeholder="Filter by Request ID" autocomplete="off" />
        </div>
        <label class="conversation-filter">
          <span class="visually-hidden">Query by Conversation ID</span>
          <select id="conversation-select" aria-label="Query by Conversation ID">
            <option value="">All conversations</option>
          </select>
        </label>
        <div id="endpoint-filter" class="segmented-control" role="group" aria-label="Endpoint filter">
          <button class="active" type="button" data-value="all">All</button>
          <button type="button" data-value="runsse">RunSSE</button>
          <button type="button" data-value="bidiappend">BidiAppend</button>
        </div>
        <details id="bidi-message-filter" class="multi-select-filter" hidden>
          <summary>All message types</summary>
          <div id="bidi-message-options" class="multi-select-menu"></div>
        </details>
        <label class="checkbox-control">
          <input id="show-options-checkbox" type="checkbox" />
          <span>Show OPTIONS</span>
        </label>
        <div id="sort-order" class="segmented-control sort-control" role="group" aria-label="Sort order">
          <button type="button" data-value="asc">Oldest first</button>
          <button class="active" type="button" data-value="desc">Newest first</button>
        </div>
        <span id="request-count" class="request-count">0 requests</span>
      </section>

      <main id="workspace" class="workspace">
        <section class="request-list-pane">
          <table class="request-table">
            <thead>
              <tr>
                <th class="status-column"></th>
                <th class="index-column">#</th>
                <th>URL</th>
                <th class="request-id-column">Request ID</th>
                <th class="kind-column">Message</th>
                <th class="method-column">Method</th>
                <th class="code-column">Status</th>
                <th class="size-column">Response</th>
                <th class="time-column">Duration</th>
              </tr>
            </thead>
            <tbody id="request-list"></tbody>
          </table>
          <div id="empty-state" class="empty-state">Waiting for requests from Cursor</div>
        </section>

        <div id="horizontal-splitter" class="horizontal-splitter" role="separator" aria-label="Resize details area"></div>

        <section id="detail-pane" class="detail-pane">
          <div id="selection-summary" class="selection-summary">
            <span class="method-badge">POST</span>
            <span class="status-badge">No selection</span>
            <code>Select a request to inspect its details</code>
          </div>
          <div class="detail-columns">
            <section class="payload-panel" data-side="request">
              <div class="panel-header">
                <strong>Request</strong>
                <nav class="tabs" aria-label="Request details">
                  <button type="button" data-tab="headers">Headers</button>
                  <button type="button" data-tab="body" class="active">Body</button>
                  <button type="button" data-tab="frames">Frames</button>
                  <button type="button" data-tab="raw">Raw</button>
                </nav>
                <button class="copy-button" type="button" data-copy-side="request" title="Copy">Copy</button>
              </div>
              <div id="request-content" class="panel-content"></div>
            </section>
            <section class="payload-panel" data-side="response">
              <div class="panel-header">
                <strong>Response</strong>
                <nav class="tabs" aria-label="Response details">
                  <button type="button" data-tab="headers">Headers</button>
                  <button type="button" data-tab="body" class="active">Body</button>
                  <button type="button" data-tab="frames">Frames</button>
                  <button type="button" data-tab="raw">Raw</button>
                </nav>
                <button class="copy-button" type="button" data-copy-side="response" title="Copy">Copy</button>
              </div>
              <div id="response-content" class="panel-content"></div>
            </section>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="connection-label">Live connection</span>
        <span id="traffic-summary">↑ 0 B ↓ 0 B</span>
        <span id="upstream-url"></span>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
